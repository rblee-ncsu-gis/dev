[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asbuilt-matcher"
version = "0.1.0"
description = "Local, review-first utility as-built PDF intelligence pilot"
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.24,<2"]

[project.scripts]
asbuilt-matcher = "asbuilt_matcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asbuilt_matcher = ["assets/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
